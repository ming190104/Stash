name: CI

# 只做「与平台无关的正确性检查」：lint / tsc / 单测 + 覆盖率闸门 / 构建，后端 test + clippy。
# 不出安装包（打包另走 release 流程），所以跑在 windows-latest 上、不需要签名与 WebView2 额外安装。
on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的新推送取消上一轮未跑完的检查，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端 · lint / tsc / test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # verify:code = eslint src && tsc --noEmit && vitest run --coverage && vite build
      - run: npm run verify:code

  rust:
    name: 后端 · test / clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 工具链版本由仓库根的 rust-toolchain.toml 锁定，rustup 会自动装好
      - run: rustc --version
      # verify:rust = cargo test && cargo clippy --all-targets -- -D warnings
      - run: npm run verify:rust
